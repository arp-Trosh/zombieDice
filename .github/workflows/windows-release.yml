# Builds the Windows release on a real Windows machine, tests it there, and publishes it.
# Pushing a tag like v1.0.0 makes a GitHub release; running it by hand just builds and tests.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Unit tests (on Windows)
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest -v

      - name: Build
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          pwsh packaging/windows/build.ps1 -Version $version

      - name: Self-test the packaged game
        run: |
          $env:ZOMBIEDICE_SELFTEST = "1"
          & dist/ZombieDice/ZombieDice.exe
          if ($LASTEXITCODE -ne 0) { throw "self-test failed with exit code $LASTEXITCODE" }

      - name: Play it in a Windows console (ConPTY)
        run: |
          python -m pip install --disable-pip-version-check pywinpty
          python packaging/windows/smoke_test.py dist/ZombieDice/ZombieDice.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ZombieDice-${{ env.VERSION }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content packaging/windows/release-notes.md -Raw).Replace("{VERSION}", $env:VERSION)
          $notes += "`n`nSHA-256: ``$((Get-Content dist/*.sha256).Split(' ')[0])``"
          $notes | Set-Content -Encoding utf8 notes.md
          gh release create $env:GITHUB_REF_NAME (Get-Item dist/*.zip).FullName (Get-Item dist/*.sha256).FullName `
            --title "Zombie Dice $env:VERSION" --notes-file notes.md
